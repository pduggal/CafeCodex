# Supabase pauses free-tier projects after 7 days without traffic.
# A cheap read every few days keeps the project awake. Uses only the public anon key (RLS applies).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 14 */3 * *" # every 3 days, 14:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read one row from cafes
        env:
          SUPABASE_URL: https://slwymfjwjhklgbijgixc.supabase.co
        run: |
          # The anon key is public by design and already committed in lib/supabase.js.
          anon_key=$(grep -o 'eyJ[A-Za-z0-9_.-]*' lib/supabase.js | head -1)
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/cafes?select=id&limit=1" \
            -H "apikey: $anon_key" \
            -H "Authorization: Bearer $anon_key")
          echo "HTTP $status"
          [ "$status" = "200" ]
